<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nabd connects hospitals with matching blood donors over WhatsApp. Post a request and reach the right people in minutes." />
    <meta name="theme-color" content="#C8102E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nabd | Blood donor platform</title>
    <script>
      try {
        var t = localStorage.getItem('nabd-theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
